#showtoc {
    display: none !important;
}

/* An unfolded video opens over the slide instead of pushing the text below it
   down. Out of the flow but with no offsets, the sub-list stays exactly where
   it would have been, right under its title. Covers YouTube videos, in their frame
   (.video-frame, straptoc.js), and local videos (ul.strapvid). */
ul:has(> li > .video-frame),
ul.strapvid {
    position: absolute;
    z-index: 1000;
}

ul:has(> li > .video-frame) {
    list-style: none;
}

/* The frame around a YouTube video: an opaque white mat, by which the video
   is dragged, with the close button in its top-right corner. */
.video-frame {
    display: inline-block;
    position: relative;
    padding: 42px;
    background: #fff;
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35);
    cursor: move;
}

.video-close {
    position: absolute;
    top: 7px;
    right: 7px;
    width: 28px;
    height: 28px;
    padding: 0;
    border: 2px solid #333;
    border-radius: 50%;
    background: #fff;
    color: #333;
    font: bold 18px/1 Arial, sans-serif;
    cursor: pointer;
}

.video-close:hover {
    background: #333;
    color: #fff;
}

/* A local video is resized by its frame's corner, in the white mat: the
   video's own corner holds the player's fullscreen button. The frame's width
   is what the handle sets (box-sizing is border-box, from Bootstrap: 684px
   leaves 600px of video); the height follows the video, whatever its ratio. */
.video-frame.resizable-frame {
    width: 684px;
    min-width: 280px;
    max-width: 95vw;
    height: auto !important;
    overflow: hidden;
    resize: both;
}

.video-frame.resizable-frame video {
    display: block;
    width: 100%;
    height: auto;
    border: 3px solid #333;
    background: #000;
    cursor: default;
}

/* The YouTube thumbnail and player, in the frame above, with a handle in the
   bottom-right corner to resize them. resize: both, for the diagonal cursor;
   the height the handle writes inline loses to height: auto !important, so
   only the width really changes and the 16/9 ratio holds (it also overrides
   the fixed height straptoc sets). The player inherits the thumbnail's width
   (straptoc.js). */
.youtube,
[id^="youtube_"] {
    box-sizing: border-box;
    border: 3px solid #333;
    border-radius: 0;
    position: relative;
    background-color: #000;
    background-size: cover;
    aspect-ratio: 16 / 9;
    height: auto !important;
    min-width: 200px;
    max-width: 95vw;
    margin: 0 !important;
    overflow: hidden;
    resize: both;
}

[id^="youtube_"] iframe {
    display: block;
    width: 100%;
    height: 100%;
    margin: 0;
    border: 0;
}

/* The resize corner of the player. With square corners the YouTube iframe,
   isolated by Chrome, takes the press there before the browser's resize handle
   does; this square of the slide's own, laid over the iframe, keeps it on the
   page. It also draws a visible grip. */
[id^="youtube_"]::after {
    content: '';
    position: absolute;
    right: 0;
    bottom: 0;
    width: 18px;
    height: 18px;
    z-index: 1;
    cursor: nwse-resize;
    background: linear-gradient(135deg,
        transparent 45%, rgba(255, 255, 255, 0.8) 45%, rgba(255, 255, 255, 0.8) 55%,
        transparent 55%, transparent 70%, rgba(255, 255, 255, 0.8) 70%,
        rgba(255, 255, 255, 0.8) 80%, transparent 80%);
}

/* Set by straptoc.js while the player is being resized. */
.yt-resizing iframe {
    pointer-events: none;
}
